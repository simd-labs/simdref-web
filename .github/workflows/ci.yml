name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install dev dependencies
        run: pip install pytest playwright

      - name: Install Playwright's Chromium
        run: python -m playwright install --with-deps chromium

      - name: No simdref import (this repo ships static files only)
        run: |
          if grep -rE 'import simdref|from simdref' --include='*.py' --include='*.js' .; then
            echo "::error::found a simdref import — this repo must not depend on the core package"
            exit 1
          fi

      - name: node --check web/app.js
        run: node --check web/app.js && node --check web/lines.js && node --check web/identity.js

      - name: Download the byte-identity wasm tools (wasm-v1 release)
        # Verify each file against the release's own SHA256SUMS, same as
        # rebuild-site.yml does for the deployed site.
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-v1"
          base=https://github.com/simd-labs/visualizer/releases/download/wasm-v1
          curl -fsSL -o "$RUNNER_TEMP/wasm-v1/SHA256SUMS" "$base/SHA256SUMS"
          for f in llvm-mc.js llvm-mc.wasm xedform.cjs xedform.wasm; do
            curl -fsSL -o "$RUNNER_TEMP/wasm-v1/$f" "$base/$f"
          done
          cd "$RUNNER_TEMP/wasm-v1"
          grep -E ' (llvm-mc\.js|llvm-mc\.wasm|xedform\.cjs|xedform\.wasm)$' SHA256SUMS | sha256sum -c -
          echo "SIMDREF_WEB_IDENTITY_WASM=$RUNNER_TEMP/wasm-v1" >> "$GITHUB_ENV"

      - name: pytest
        run: python -m pytest -q
