name: Rebuild site

# Pulls the `data-latest` release from the core simdref repo (published by
# its ci.yml `publish-data` job), exports the JSON site-data bundle, and
# deploys it next to this repo's static web/ files on GitHub Pages.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, 6h after core's Monday data-latest refresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Which core repo to pull the release from. Overridden by the `CORE_REPO`
  # repository variable on a validation fork; production leaves it unset and
  # gets the real simdref repo.
  SIMDREF_CORE_REPO: ${{ vars.CORE_REPO || 'simd-labs/simdref' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install simdref
        # Installs the wheel from SIMDREF_CORE_REPO's latest versioned
        # release (skips its `data-*` catalog releases, which carry no wheel).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api "repos/${SIMDREF_CORE_REPO}/releases" --jq '[.[] | select(.tag_name | test("^v[0-9]")) | .tag_name][0]')
          [ -n "$tag" ] || { echo "::error::no versioned release found on ${SIMDREF_CORE_REPO}"; exit 1; }
          gh release download "$tag" --repo "$SIMDREF_CORE_REPO" --pattern '*.whl' --dir /tmp/simdref-wheel --clobber
          pip install /tmp/simdref-wheel/*.whl

      - name: Pull data-latest
        run: simdref update --from-release

      - name: Export site data
        run: simdref export --out-dir _site

      - name: Assemble static files
        run: cp web/index.html web/app.js web/style.css web/favicon.svg web/logo.svg _site/

      - name: Test against the real export
        # The e2e suite normally runs against the committed fixture; here it
        # runs against this run's real `simdref export` output, so a core
        # format change fails the build instead of silently shipping a
        # broken site.
        run: |
          pip install pytest playwright
          playwright install --with-deps chromium
          SIMDREF_WEB_SITE_DATA="$PWD/_site" python -m pytest tests/test_web_e2e.py -q

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
